name: Desktop app

# Builds the Windows installer on every push to main. When desktop/package.json has a new version,
# it publishes a GitHub release (v<version>), which installed copies of the app update themselves from.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build.py
      - run: npm ci
        working-directory: desktop
      - run: npm install --no-save playwright@1.48.2
      - name: Web app and add-on tests
        env: { CHROME: /usr/bin/google-chrome }
        run: |
          (cd dist/web && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          node tests/web/ui_zip.js
          node tests/web/ui_sites.js
          node tests/web/ui_print.js "Creator 5 Pro"
          node tests/web/ui_makerworld.js
          node tests/web/ui_slice.js "Creator 5 Pro"
      - name: Desktop app tests
        env: { ELECTRON: desktop/node_modules/electron/dist/electron }
        run: xvfb-run -a node tests/desktop/smoke.js | tee smoke.txt && ! grep -q FAIL smoke.txt

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
        working-directory: desktop
      - name: Build, and publish a release if this version is new
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          npm run dist
          ls dist
          FILES="dist/Plate-Builder-Setup-$VER.exe dist/Plate-Builder-Setup-$VER.exe.blockmap dist/latest.yml"
          if gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VER exists: refreshing its files"
            gh release upload "v$VER" $FILES --clobber -R "$GITHUB_REPOSITORY"
          else
            echo "Publishing v$VER"
            git tag "v$VER" && git push origin "v$VER"
            gh release create "v$VER" $FILES -R "$GITHUB_REPOSITORY" --title "Plate Builder $VER" --notes "Installed copies of Plate Builder update to this version by themselves."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Plate-Builder-Setup
          path: desktop/dist/*.exe
